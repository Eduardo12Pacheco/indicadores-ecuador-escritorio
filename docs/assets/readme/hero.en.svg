<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Ecuador Indicators</title>
  <desc id="hero-desc">Ecuador Indicators desktop app: explore and compare Ecuadorian indicators from an offline World Bank snapshot. Illustration: one highlighted Ecuadorian series among comparison series, indexed to a base year.</desc>

  <rect width="1200" height="500" rx="28" fill="#f6f4ee"/>

  <g id="title-block" transform="translate(0 -24)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="72" y="112" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" letter-spacing="2" fill="#1b47c4">DESKTOP · OFFLINE</text>
    <text x="72" y="230" font-size="104" font-weight="800" fill="#15171c">Ecuador</text>
    <text x="72" y="338" font-size="104" font-weight="800" fill="#1b47c4">Indicators</text>
    <text x="72" y="396" font-size="38" fill="#555b68">Explore and compare</text>
    <text x="72" y="442" font-size="38" fill="#555b68">Ecuadorian indicators</text>
  </g>

  <g id="project-proof" transform="translate(800 0)">
    <text x="0" y="188" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#555b68">Base 100</text>
    <line x1="0" y1="206" x2="328" y2="206" stroke="#7d7a70" stroke-width="2" stroke-dasharray="8 8"/>
    <line x1="0" y1="384" x2="328" y2="384" stroke="#d6d2c6" stroke-width="2"/>
    <g fill="none" stroke="#b9b5a8" stroke-width="4" stroke-linecap="round">
      <path d="M0 292 C 50 286 90 316 140 300 S 230 262 328 270"/>
      <path d="M0 330 C 50 342 110 312 170 326 S 260 348 328 338"/>
      <path d="M0 262 C 60 252 120 270 180 244 S 280 216 328 226"/>
      <path d="M0 356 C 60 362 120 336 190 352 S 270 370 328 362"/>
    </g>
    <path d="M0 232 C 50 228 80 252 120 248 S 200 182 250 166 S 300 130 328 118" fill="none" stroke="#1b47c4" stroke-width="9" stroke-linecap="round"/>
    <circle cx="328" cy="118" r="11" fill="#f5c400" stroke="#15171c" stroke-width="3"/>
    <rect x="186" y="60" width="142" height="44" rx="8" fill="#f5c400"/>
    <text x="206" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#15171c">Ecuador</text>
    <text x="0" y="430" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#555b68">Source: World Bank</text>
  </g>
</svg>
