[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ecuador-data"
version = "0.1.0"
description = "Reproducible World Bank WDI pipeline for Ecuador Indicators"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Eduardo Pacheco" }]
dependencies = [
  "httpx>=0.28.1",
  "pydantic>=2.14.4",
  "pydantic-settings>=2.16.3",
  "structlog>=26.1.0",
  "typer>=0.29.2",
]

[project.optional-dependencies]
lakehouse = ["duckdb>=2.0.0"]

[dependency-groups]
dev = [
  "duckdb>=2.0.0",
  "pytest>=8.4",
  "pytest-cov>=7.0",
  "hypothesis>=6.140",
  "respx>=0.22",
  "mypy>=1.18",
  "ruff>=0.14",
  "import-linter>=2.7",
  "pip-audit>=2.9",
  "pillow>=12.0.0",
]

[project.scripts]
ecuador-data = "ecuador_data.cli:app"

[tool.uv]
package = true

[tool.importlinter]
root_packages = ["ecuador_data"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Hexagonal layers (adapters > application > ports > domain)"
type = "layers"
layers = [
  "ecuador_data.adapters",
  "ecuador_data.application",
  "ecuador_data.ports",
  "ecuador_data.domain",
]

[[tool.importlinter.contracts]]
name = "Adapters do not import the application layer"
type = "forbidden"
source_modules = ["ecuador_data.adapters"]
forbidden_modules = ["ecuador_data.application"]

[[tool.importlinter.contracts]]
name = "Domain does not import infrastructure libraries"
type = "forbidden"
source_modules = ["ecuador_data.domain"]
forbidden_modules = ["httpx", "duckdb", "sqlite3"]

[tool.hatch.build.targets.wheel]
packages = ["src/ecuador_data"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PL", "RUF", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "S311", "RUF043"]
"src/ecuador_data/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
addopts = "--cov=ecuador_data --cov-report=term-missing --cov-report=json:coverage.json --cov-fail-under=85"
testpaths = ["tests"]

[tool.coverage.run]
omit = ["*/__main__.py"]
