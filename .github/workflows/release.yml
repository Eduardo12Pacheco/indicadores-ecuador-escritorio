name: Release

# Tag-driven release (S29): every installer is built on its native runner,
# installed on a clean runner, smoke-tested with `--self-check`, and only then
# published together with checksums, generated notes and provenance. A manual
# dispatch defaults to a dry run, which builds and smoke-tests but never
# publishes because the publish job only runs for tags.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and smoke-test every installer without publishing a release
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-toolchain
        with:
          linux-deps: "false"

      - name: Check the version and release tag
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            node scripts/check-version-sync.mjs --tag "$GITHUB_REF_NAME"
          else
            node scripts/check-version-sync.mjs
          fi

  build:
    name: Build ${{ matrix.name }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-22.04
            args: ""
            platform: linux
            arch: x64
            target-dir: target/release/bundle
            rust-targets: ""
          - name: windows-x64
            os: windows-latest
            args: ""
            platform: windows
            arch: x64
            target-dir: target/release/bundle
            rust-targets: ""
          - name: macos-arm64
            os: macos-latest
            args: --target aarch64-apple-darwin
            platform: macos
            arch: arm64
            target-dir: target/aarch64-apple-darwin/release/bundle
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: macos-x64
            os: macos-latest
            args: --target x86_64-apple-darwin
            platform: macos
            arch: x64
            target-dir: target/x86_64-apple-darwin/release/bundle
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-toolchain
        with:
          rust-targets: ${{ matrix.rust-targets }}

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Read the shared version
        id: version
        shell: bash
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build the installers
        uses: tauri-apps/tauri-action@v1
        with:
          args: ${{ matrix.args }}

      - name: Collect the D28 release assets
        shell: bash
        run: |
          node scripts/collect-artifacts.mjs \
            --version "${{ steps.version.outputs.value }}" \
            --platform "${{ matrix.platform }}" \
            --arch "${{ matrix.arch }}" \
            --target-dir "${{ matrix.target-dir }}" \
            --out release-assets

      - name: Upload the installers
        uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.name }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 7

  smoke-linux:
    name: Smoke test Linux installers
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: installer-linux-x64
          path: release-assets

      - name: Install the deb and xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb
          sudo apt-get install -y ./release-assets/*.deb

      - name: Self-check the installed application
        run: |
          set -euo pipefail
          # Run outside the checkout so the bundled resource path is exercised,
          # not the repository's own data/ directory.
          cd "$RUNNER_TEMP"
          xvfb-run -a ecuador-indicators --self-check --out sc-deb.json
          node "$GITHUB_WORKSPACE/scripts/assert-self-check.mjs" sc-deb.json

      - name: Self-check the AppImage
        run: |
          set -euo pipefail
          chmod +x release-assets/*.AppImage
          cd "$RUNNER_TEMP"
          # The AppImage launcher changes into its AppDir before starting the app, so a
          # relative --out would be written there instead of here. Use an absolute path.
          report="$RUNNER_TEMP/sc-appimage.json"
          xvfb-run -a "$GITHUB_WORKSPACE"/release-assets/*.AppImage --appimage-extract-and-run --self-check --out "$report"
          node "$GITHUB_WORKSPACE/scripts/assert-self-check.mjs" "$report"

  smoke-windows:
    name: Smoke test Windows installers
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: installer-windows-x64
          path: release-assets

      - name: Install the NSIS package silently and self-check it
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Get-ChildItem release-assets -Filter *.exe | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer not found" }
          $process = Start-Process -FilePath $installer.FullName -ArgumentList "/S" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "NSIS install failed: $($process.ExitCode)" }

          $known = @(
            (Join-Path $env:LOCALAPPDATA "Ecuador Indicators\ecuador-indicators.exe"),
            (Join-Path $env:ProgramFiles "Ecuador Indicators\ecuador-indicators.exe")
          ) | Where-Object { Test-Path $_ }
          if (-not $known) {
            $known = Get-ChildItem "$env:LOCALAPPDATA","$env:ProgramFiles" `
              -Filter ecuador-indicators.exe -Recurse -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName
          }
          $executable = $known | Select-Object -First 1
          if (-not $executable) { throw "installed ecuador-indicators.exe not found" }

          # Run outside the checkout so the bundled resource path is exercised,
          # not the repository's own data/ directory.
          Set-Location $env:RUNNER_TEMP
          & $executable --self-check --out sc-nsis.json
          if ($LASTEXITCODE -ne 0) { throw "NSIS self-check failed: $LASTEXITCODE" }
          node "$env:GITHUB_WORKSPACE\scripts\assert-self-check.mjs" sc-nsis.json

      - name: Extract the MSI administratively and self-check it
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $msi = Get-ChildItem release-assets -Filter *.msi | Select-Object -First 1
          if (-not $msi) { throw "MSI installer not found" }
          $target = Join-Path $env:RUNNER_TEMP "msi-extract"
          $arguments = @("/a", "`"$($msi.FullName)`"", "/qn", "TARGETDIR=`"$target`"")
          $process = Start-Process msiexec.exe -ArgumentList $arguments -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "MSI extraction failed: $($process.ExitCode)" }

          $executable = Get-ChildItem $target -Filter ecuador-indicators.exe -Recurse |
            Select-Object -First 1
          if (-not $executable) { throw "extracted ecuador-indicators.exe not found" }
          Set-Location $env:RUNNER_TEMP
          & $executable.FullName --self-check --out sc-msi.json
          if ($LASTEXITCODE -ne 0) { throw "MSI self-check failed: $LASTEXITCODE" }
          node "$env:GITHUB_WORKSPACE\scripts\assert-self-check.mjs" sc-msi.json

  smoke-macos-arm64:
    name: Smoke test macOS arm64 dmg
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: installer-macos-arm64
          path: release-assets

      - name: Mount the dmg and self-check the app
        run: |
          set -euo pipefail
          mount_point="$(mktemp -d)"
          hdiutil attach release-assets/*.dmg -mountpoint "$mount_point" -nobrowse -quiet
          trap 'hdiutil detach "$mount_point" -quiet || true' EXIT
          app="$(find "$mount_point" -maxdepth 2 -name '*.app' -print -quit)"
          # Run outside the checkout so the bundled Resources path is exercised,
          # not the repository's own data/ directory.
          cd "$RUNNER_TEMP"
          "$app/Contents/MacOS/ecuador-indicators" --self-check --out sc-dmg.json
          node "$GITHUB_WORKSPACE/scripts/assert-self-check.mjs" sc-dmg.json

  smoke-macos-x64:
    name: Smoke test macOS x64 dmg
    needs: build
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: installer-macos-x64
          path: release-assets

      - name: Mount the dmg and self-check the app
        run: |
          set -euo pipefail
          mount_point="$(mktemp -d)"
          hdiutil attach release-assets/*.dmg -mountpoint "$mount_point" -nobrowse -quiet
          trap 'hdiutil detach "$mount_point" -quiet || true' EXIT
          app="$(find "$mount_point" -maxdepth 2 -name '*.app' -print -quit)"
          # Run outside the checkout so the bundled Resources path is exercised,
          # not the repository's own data/ directory.
          cd "$RUNNER_TEMP"
          "$app/Contents/MacOS/ecuador-indicators" --self-check --out sc-dmg.json
          node "$GITHUB_WORKSPACE/scripts/assert-self-check.mjs" sc-dmg.json

  publish:
    name: Publish release
    needs: [smoke-linux, smoke-windows, smoke-macos-arm64, smoke-macos-x64]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          pattern: installer-*
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        run: |
          set -euo pipefail
          cd release-assets
          checksums="$(mktemp)"
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z | xargs -0 sha256sum > "$checksums"
          mv "$checksums" SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: release-notes.md

      - name: Attest the installer provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: release-assets/*

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Ecuador Indicators $GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            "${prerelease[@]}"
